[package]
name = "sklad"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Desktop app for Arch Linux, Debian and Ubuntu: everything installed in one list, from any source, with safe removal"
homepage = "https://pavver.github.io/sklad/"
repository = "https://github.com/pavver/sklad"
readme = "README.md"
keywords = ["arch-linux", "debian", "pacman", "apt", "uninstaller"]
categories = ["gui", "os::linux-apis"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "wgpu", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.45"
rusqlite = { version = "0.37", features = ["bundled"] }
quick-xml = "0.38"
serde_json = "1"
operator-ui-tokens = { git = "https://github.com/pavver/operator-design-system", rev = "66afa5e61508a1b51fd98f59c211f820348d2b84" }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[lints.rust]
dead_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
