[package]
name = "sklad"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A catalogue of everything installed on an Arch Linux system, with safe removal"
repository = "https://github.com/pavver/sklad"
readme = "README.md"
keywords = ["arch-linux", "pacman", "packages", "egui", "cleanup"]
categories = ["command-line-utilities", "os::linux-apis"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "wayland", "wgpu", "x11"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
resvg = "0.45"
rusqlite = { version = "0.37", features = ["bundled"] }
quick-xml = "0.38"
serde_json = "1"
operator-ui-tokens = { git = "https://github.com/pavver/operator-design-system", rev = "c69e965644fc1825a3f25eecb1caedf27e807c2d" }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

[lints.rust]
dead_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
