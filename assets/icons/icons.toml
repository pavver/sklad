# Icons sklad needs beyond the Operator UI set, which comes with the operator-ui-tokens crate.
#
# Material Symbols Sharp, the icon source of the design system.
# Import or refresh with `python3 scripts/import_icons.py`; `--check` compares with the source.
#
# Fields are those of the design system manifest:
#   material = Material Symbols name (https://fonts.google.com/icons?icon.style=Sharp)
#   fill     = true for the filled variant (default false, outlined)
#   opsz     = optical size: 20 (default, for icons up to 5 DU), 24, 40 or 48

