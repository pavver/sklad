name: Release

# A tag `vX.Y.Z` builds the pacman and Debian packages, publishes them as a GitHub release, and
# refreshes the site on GitHub Pages: the project page, the pacman repository under /x86_64/ and
# the apt repository under /debian/.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  debian:
    runs-on: ubuntu-24.04
    # The oldest supported Debian, so the C library the program needs is there on newer systems.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build the Debian package
        run: scripts/build_deb.sh
      - name: Signed apt repository
        env:
          GPG_KEY: ${{ secrets.PACKAGER_GPG_KEY }}
        run: |
          # apt refuses an unsigned repository, so an unsigned build stops here.
          test -n "$GPG_KEY" || { echo "The PACKAGER_GPG_KEY secret is missing"; exit 1; }
          apt-get update -qq && apt-get install -y -qq apt-utils gnupg
          echo "$GPG_KEY" | gpg --batch --import
          mkdir -p repository
          cp target/debian/*.deb repository/
          scripts/apt_repository.sh repository
      - uses: actions/upload-artifact@v4
        with:
          name: debian
          path: repository

  package:
    needs: debian
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git rust rust-wasm trunk github-cli
      - uses: actions/checkout@v4
      - name: Build as an unprivileged user
        run: |
          useradd --create-home builder
          install -d -o builder build
          cp packaging/arch/PKGBUILD build/
          chown builder build/PKGBUILD
          # makepkg refuses root, and the builder may not call pacman, so root installs the dependencies.
          pacman -S --noconfirm --needed $(bash -c 'source build/PKGBUILD; echo "${depends[@]} ${makedepends[@]}"')
          cd build
          sudo -u builder makepkg --noconfirm
      - name: Sign
        env:
          GPG_KEY: ${{ secrets.PACKAGER_GPG_KEY }}
        run: |
          # pacman refuses unsigned packages from this repository, so an unsigned build stops here.
          test -n "$GPG_KEY" || { echo "The PACKAGER_GPG_KEY secret is missing"; exit 1; }
          echo "$GPG_KEY" | gpg --batch --import
          for file in build/*.pkg.tar.zst; do
            gpg --batch --yes --detach-sign --no-armor "$file"
          done
      - name: Repository database
        run: |
          mkdir -p pages/x86_64
          cp build/*.pkg.tar.zst* pages/x86_64/
          cd pages/x86_64
          repo-add --sign sklad.db.tar.gz *.pkg.tar.zst
          # Pages serves no symbolic links, so the short names become copies.
          for link in sklad.db sklad.files sklad.db.sig sklad.files.sig; do
            if [ -L "$link" ]; then cp --remove-destination "$(readlink "$link")" "$link"; fi
          done
      - uses: actions/download-artifact@v4
        with:
          name: debian
          path: pages/debian
      - name: Project page
        run: |
          # The page is built from Operator UI web components; it brings its own images and key.
          scripts/build_site.sh
          cp -r site/dist/. pages/
          ls -R pages
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release create "$GITHUB_REF_NAME" build/*.pkg.tar.zst* pages/debian/*.deb \
            --title "Sklad ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: package
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
