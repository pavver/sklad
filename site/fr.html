  <noscript><p>Les gestionnaires de paquets ne montrent que ce qu'ils ont installé eux-mêmes. Sklad réunit dans une seule liste les paquets pacman, AUR et apt, les applications Flatpak, les jeux Steam, les chaînes d'outils Rust, les outils Cargo, npm et Python, les environnements Python, les conteneurs et images Docker, et les fichiers hors gestionnaires. Triez-la par dernier lancement, lisez ce qu'est chaque entrée, et désinstallez-la avec une commande que vous voyez avant qu'elle ne s'exécute.</p></noscript>
